<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forenture report help preview</title><style>body{font:15px/1.7 system-ui;max-width:950px;margin:40px auto;padding:0 20px;background:#fafbf8}button{padding:9px 14px;margin-right:8px;cursor:pointer}button[aria-selected=true]{background:#d9ebe0}section{padding:20px;background:white;border:1px solid #d5e3d9;border-radius:10px}</style><h1>Report help preview</h1><p>This is a help-only preview. No live report data, AI requests, or account connection. Choose a tab, then select the small ? icon.</p><section id="conversationReports"><h3>Your conversation reports</h3><div role="tablist"><button id="paired-tab-quick_summary" role="tab" aria-selected="false">Quick summary</button><button id="paired-tab-conversation_insights" role="tab" aria-selected="false">Conversation insights</button><button id="paired-tab-concepts_network" role="tab" aria-selected="true">Concepts network</button></div><p>The ? icon opens the guide for the selected tab. You can switch help sections inside the dialog.</p></section><script>document.querySelectorAll('[role=tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[role=tab]').forEach(t=>t.setAttribute('aria-selected',String(t===b)));});</script><script>(() => {
'use strict';
if (window.__forentureReportsHelpInstalled) return;
window.__forentureReportsHelpInstalled = true;
const HELP = {"overview": {"title": "Your conversation reports", "intro": "Three views of the same selected saved conversation state. These views organize the discussion; they do not independently verify business facts.", "groups": [["Choose a view", ["Quick summary groups passages from your prompts into broad categories.", "Conversation insights presents AI-proposed concepts, connections, changes, and open questions from prompts and responses.", "Concepts network visualizes saved concepts and relationships across conversation turns."]], ["Report snapshot versus graph turn", ["Report snapshot selects a saved report pair, including its captured messages and model history.", "Current conversation selects a saved report matching the latest completed conversation state, if one exists. It does not itself generate a report.", "The graph timeline selects one exchange within that saved history. One turn means one completed user prompt and assistant response.", "A saved report may not include newer messages. Its request/completion timestamps identify the captured report; the graph timeline identifies the exchange being viewed."]], ["Viewing and refreshing", ["Switching to another report tab displays its saved contents when available.", "Clicking the already active Quick summary or Conversation insights tab refreshes BOTH reports. Selecting either report tab when no matching pair exists also starts generation.", "Generation makes AI requests and can incur cost. Click once and wait for the status message.", "Concepts network only reads saved data. Clicking it does not generate reports or calculate new weights.", "If generation fails, no new pair is saved by this frontend. Earlier saved pairs remain available in the snapshot selector."]]]}, "quick_summary": {"title": "Quick summary", "intro": "A keyword-assisted overview of what you wrote—not an AI evaluation of your venture.", "groups": [["What appears here", ["Passages from user prompts in completed exchanges are grouped under headings such as Goals, Money and pricing, Customers, and Risks.", "Assistant responses are excluded from this summary.", "A passage can appear in more than one category. Categories are keyword matches, not judgments of importance or validity.", "Other passages to review contains passages that did not match the predefined categories."]], ["How to read it", ["Expand a category to read the original passages.", "A missing category does not mean that the topic was absent or unimportant; the keyword rules may not have matched it.", "Use Conversation insights or Concepts network to inspect interpreted concepts and their relationships."]]]}, "conversation_insights": {"title": "Conversation insights", "intro": "An AI-proposed interpretation of how the conversation is developing. Review it against the original messages.", "groups": [["Main sections", ["Your situation summarizes concepts supported by user passages.", "Goals and limits shows extracted goals and constraints.", "Factors discussed includes concepts, drivers, and outcomes.", "Directions and options shows possible actions or approaches discussed.", "Possible connections are proposed associations, not established causes.", "How the discussion developed shows recorded changes across exchanges.", "Questions still open lists unresolved issues proposed by the extraction model."]], ["Latest-exchange cards", ["When present, the five cards show the previous state, your latest input, the assistant’s response, the proposed updated state, and possible next questions.", "They reconstruct the conversation from saved records. They do not reveal the assistant’s hidden reasoning or certify that an assumption caused an answer."]], ["Sources, estimates, and review", ["Expand a concept and its Source passages to inspect user and assistant quotations.", "Assistant recommendations are not automatically decisions or commitments made by you.", "Extraction confidence is an uncalibrated score about the extraction. It is separate from concept weight and is not a probability of business success.", "A recorded user probability estimate is an attributed user statement, not an independently validated forecast.", "AI-proposed or proposed_unreviewed means the interpretation has not been recorded as reviewed."]]]}, "concepts_network": {"title": "Concepts network", "intro": "See which concepts are present, how strongly the discussion connects them, and how their relative prominence changes across saved turns.", "groups": [["1 · Circles: concepts", ["Each circle represents one extracted concept, such as Customer demand, Pricing, or Pilot testing. Its label identifies the concept.", "Larger circles indicate higher saved concept weight. Smaller circles indicate lower weight. A minimum circle size keeps low-weight concepts visible; circle area is not an exact percentage chart.", "For reports generated by the normalized-weight extractor, concept weights represent shares of estimated prominence in the cumulative discussion through the selected turn. Nonempty models have weights totaling 1 before display rounding.", "Example: 0.40 means 40% of the allocated concept-prominence weight among the concepts included in that model. It does NOT mean 40% probability of success, truth, or customer demand.", "Gemini proposes prominence scores; the server normalizes them by dividing each score by the total. These remain AI-proposed judgments, not objective measurements of importance.", "Only reports generated with the updated extractor use this distribution rule. Older saved reports may have missing weights or a different recorded weighting method."]], ["2 · Green shades: first recorded appearance", ["Dark green means first appearing in the selected turn’s supplied model history. A New badge reinforces this.", "Pale and medium greens represent earlier and more recent first appearances in that history. The component uses grouped shades, not one distinct shade for every exchange.", "Green shade does not mean importance, correctness, positive sentiment, or probability.", "An older concept can be large and pale because it remains prominent. A new concept can be small and dark because it is new but has a modest weight.", "First appearance means first recorded in the available model snapshots. Missing earlier snapshots cannot establish when a concept truly first entered the conversation."]], ["3 · Outer rings and Updated badges", ["With Compare previous enabled, an existing concept gets an outer ring when its weight or definition changes, or the saved model marks a substantive change.", "Updated does not necessarily mean strengthened. The concept may have gained or lost relative weight, been clarified, or been challenged.", "Select the circle to inspect previous/current weights and the saved change descriptions. Weight differences are only displayed when both values exist."]], ["4 · Lines: relationships", ["A line represents a saved association between two concepts. A thicker line means a higher saved relationship weight; a thinner line means a lower one.", "The line label names the relationship and shows its weight. For example, supports · 0.75 describes the model’s proposed connection.", "Relationship weights estimate expressed connection strength. They are independent scores from 0 to 1 and do NOT need to total 1.", "A weight of 0.75 is not a measured 75% causal effect. Select the line to inspect its description, explanation, and source passages.", "An arrowhead appears only when the saved relationship is marked directed. Direction alone does not prove causation.", "In comparison mode, newly present relationships are highlighted. Line thickness reflects the selected turn’s weight; an absent line is not automatically a rejected relationship."]], ["5 · The ? symbol and dashed outlines", ["A question mark inside a circle means its saved weight is missing or invalid—not that the concept itself is unknown.", "A dashed circle has a neutral display size. Do not interpret that size as a calculated importance score.", "A dashed relationship line with ? also has an unavailable weight.", "Older reports do not acquire new weights just because server code changes. A successful regeneration is needed to save new values.", "Extraction confidence is never substituted for a missing weight. If regeneration fails, inspect the status message before expecting the graph to change."]], ["6 · Turn timeline and comparison", ["The graph starts at the latest exchange in the selected report. Use the slider or Previous/Next to choose another turn.", "Each slice contains that model’s concepts and relationships. Concepts first introduced later are not displayed in earlier slices.", "The updated extractor evaluates completed conversation messages from the beginning through each selected turn, not future messages.", "Compare previous adds change highlighting against the preceding saved slice. There is no earlier slice to compare for the first exchange.", "Concepts absent from a slice are not shown as active there. The comparison summary may count absences, but absence does not mean rejection.", "Positions are kept consistent while moving through one report’s slices. Distance, direction on the page, and proximity do not represent relationship strength or conceptual similarity."]], ["7 · Select, inspect, and navigate", ["Select a circle to read its definition, current and previous weights, weight explanation, first recorded appearance, review status, and source passages where saved.", "Select a line to inspect the relationship and its sources. Expand Full source message when available to read the surrounding prompt or response.", "Use Zoom in, Zoom out, or Reset view. Drag the graph background to pan.", "Open Accessible data tables for concept and relationship lists. Their buttons open the same detail panel; graph nodes can also be focused and activated with Enter or Space.", "Graph labels may be shortened to fit. Select the item or use the tables to read the full name."]], ["8 · Interpret evolution carefully", ["If new concepts enter the model, existing concepts can lose normalized share even without becoming less important in absolute terms. A lower share is not evidence that a claim became less true.", "Splitting or merging concepts can change the distribution. Compare definitions and source passages, not just numerical changes.", "Displayed weights are rounded to two decimals. Rounded values may not add up to exactly 1, and small changes may look unchanged after rounding.", "Concept weights and relationship weights measure different things. Neither is a calibrated business forecast.", "The graph shows a proposed representation of the conversation—not a complete map of reality or the AI’s internal reasoning."]]]}};
let dialog, content, closeButton, returnFocus, modeButtons;
function make(tag, value, parent) {const n=document.createElement(tag);if(value!=null)n.textContent=String(value);if(parent)parent.append(n);return n;}
function style() {
 if(document.getElementById('forenture-help-styles'))return;
 const s=make('style');s.id='forenture-help-styles';s.textContent=`
 .fr-help-icon{display:inline-flex;align-items:center;justify-content:center;width:25px;height:25px;padding:0;margin-left:9px;border:1px solid #6b8d7b;border-radius:50%;background:#f0f6f2;color:#174e33;font:700 15px/1 system-ui;vertical-align:middle;cursor:pointer}.fr-help-icon:focus-visible{outline:3px solid #c38a29;outline-offset:3px}
 .fr-help{width:min(850px,calc(100vw - 36px));max-height:85vh;padding:0;border:1px solid #bacfc1;border-radius:12px;color:#193c2a;background:#fff;font:14px/1.65 system-ui,sans-serif;box-shadow:0 12px 55px #0003}.fr-help::backdrop{background:#142e2366}.fr-help header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid #d7e4dc}.fr-help h2{margin:0;font-size:20px}.fr-help button{font:inherit;cursor:pointer;border:1px solid #b4cbbb;border-radius:6px;background:#fff;color:#19472f;padding:7px 11px}.fr-help button:focus-visible,.fr-help summary:focus-visible{outline:3px solid #c38a29}.fr-help-nav{display:flex;flex-wrap:wrap;gap:7px;padding:12px 20px;background:#f4f8f5}.fr-help-nav button[aria-pressed=true]{background:#17643b;color:white;border-color:#17643b}.fr-help-body{padding:10px 20px 24px;max-height:57vh;overflow:auto;overscroll-behavior:contain}.fr-help-body h3{font-size:18px;margin:8px 0}.fr-help-body p{margin:8px 0 16px;text-align:left}.fr-help-body details{border-top:1px solid #dce7df;padding:12px 0}.fr-help-body summary{font-weight:650;cursor:pointer}.fr-help-body li{margin:8px 0}.fr-help-body ul{padding-left:22px}.fr-help footer{padding:10px 20px;border-top:1px solid #d7e4dc;font-size:12px;color:#516b5b}@media(max-width:550px){.fr-help header,.fr-help-nav,.fr-help-body{padding-left:13px;padding-right:13px}.fr-help{max-height:90vh}.fr-help-body{max-height:59vh}}
 `;document.head.append(s);
}
function display(mode) {
 const data=HELP[mode]||HELP.overview;content.replaceChildren();
 make('h3',data.title,content);make('p',data.intro,content);
 data.groups.forEach(([heading,items],i)=>{const d=make('details',null,content);d.open=i===0;make('summary',heading,d);const list=make('ul',null,d);items.forEach(item=>make('li',item,list));});
 for(const [key,b]of modeButtons)b.setAttribute('aria-pressed',String(key===mode));
 content.scrollTop=0;
}
function ensureDialog(){
 if(dialog)return;
 style();dialog=make('dialog',null,document.body);dialog.className='fr-help';dialog.setAttribute('aria-labelledby','fr-help-title');
 const header=make('header',null,dialog);const title=make('h2','Report help',header);title.id='fr-help-title';
 closeButton=make('button','Close ×',header);closeButton.type='button';closeButton.setAttribute('aria-label','Close report help');closeButton.onclick=()=>dialog.close();
 const nav=make('nav',null,dialog);nav.className='fr-help-nav';nav.setAttribute('aria-label','Help sections');modeButtons=new Map();
 for(const [key,label]of [['overview','Overview'],['quick_summary','Quick summary'],['conversation_insights','Conversation insights'],['concepts_network','Concepts network']]){const b=make('button',label,nav);b.type='button';b.onclick=()=>display(key);modeButtons.set(key,b);}
 content=make('div',null,dialog);content.className='fr-help-body';
 make('footer','Help describes the supplied report components. Saved data and extractor versions can differ.',dialog);
 dialog.addEventListener('close',()=>{if(returnFocus?.isConnected)returnFocus.focus();});
 dialog.addEventListener('click',e=>{if(e.target!==dialog)return;const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close();});
}
function mount(){
 const root=document.getElementById('conversationReports');if(!root||root.querySelector('[data-report-help-button]'))return;
 const heading=root.querySelector('h3');if(!heading)return;
 style();const b=make('button','?',heading);b.type='button';b.className='fr-help-icon';b.dataset.reportHelpButton='true';b.title='Help with reports and the concepts graph';b.setAttribute('aria-label','Help with conversation reports');b.setAttribute('aria-haspopup','dialog');
 b.onclick=()=>{ensureDialog();returnFocus=b;const selected=root.querySelector('[role="tab"][aria-selected="true"]');const mode=selected?.id?.replace('paired-tab-','')||'overview';display(HELP[mode]?mode:'overview');if(!dialog.open)dialog.showModal();closeButton.focus();};
}
function init(){mount();new MutationObserver(()=>mount()).observe(document.body,{childList:true,subtree:true});}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});else init();
})();
</script></html>
